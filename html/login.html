<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="Y-Soft, تسجيل الدخول, حسابي, دخول واي سوفت, login ">
    <meta name="author" content="Badr Nasser ali Ziad">
    <meta name="description" content="سجل الدخول إلى حسابك في واي سوفت للوصول إلى خدماتك وإدارة مشترياتك من الأنظمة والعتاد">
    <title>تسجيل الدخول | Y-Soft</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="../css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="text-white">

    <div class="bg-overlay"></div>

    <div class="container my-5">
        
        <header class="glass-card mb-4 text-center">
            <h1 class="text-info"><i class="fa-solid fa-user-lock"></i> بوابة العملاء</h1>
            
            <nav>
                <ul class="nav justify-content-center">
                    <li class="nav-item"><a href="../index.html" class="glass-btn">الرئيسية</a></li>
                    <li class="nav-item"><a href="software.html" class="glass-btn">البرمجيات</a></li>
                    <li class="nav-item"><a href="hardware.html" class="glass-btn">العتاد</a></li>
                    <li class="nav-item"><a href="contact.html" class="glass-btn">تواصل معنا</a></li>
                    <li class="nav-item"><a href="login.html" class="glass-btn active">تسجيل الدخول</a></li>
                </ul>
            </nav>
        </header>


        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="glass-card p-4">
                    <h2 class="text-center text-info mb-4">تسجيل الدخول</h2>
                    
                    
                    <form id="loginForm" class="needs-validation" novalidate>
                        
                        <div class="mb-3">
                            <label for="email" class="form-label">البريد الإلكتروني:</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark text-info border-info"><i class="fa-solid fa-envelope"></i></span>
                                <input type="email" class="form-control text-dark" id="email" required placeholder="example@gmail.com">
                                <div class="invalid-feedback text-warning text-end">
                                    الرجاء إدخال بريد إلكتروني صحيح.
                                </div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">كلمة المرور:</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark text-info border-info"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" class="form-control text-dark" id="password" required minlength="6" placeholder="******">
                                <div class="invalid-feedback text-warning text-end">
                                    كلمة المرور يجب أن لا تقل عن 6 أحرف.
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-info w-100 fw-bold fs-5 rounded-pill">دخول <i class="fa-solid fa-arrow-right-to-bracket"></i></button>
                        
                        <div class="text-center mt-3">
                            <a href="#" class="text-light text-decoration-none">ليس لديك حساب؟ إنشاء حساب جديد</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </div>

    <script src="../js/jquery.min.js"></script>
    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>

     

</body>
</html>
